    kind: theorem
    claim: rough-heat-kernel/heat-kernel-derivatives
    status: reusable
    note: 'Time derivative of the heat kernel: d/dt p_t(x) = (x^2 - t)/(2 t^2) p_t(x) for t > 0 (the spatial
      one, -(x/t) p_t(x), is hasDerivAt_heatKernel).'
