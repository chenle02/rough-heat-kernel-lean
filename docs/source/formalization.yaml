  statements:
  - source: null
    lean: RoughHeatKernel.heatKernel_convolution_heatKernel
    module: RoughHeatKernel/Kernel.lean
    kind: theorem
    claim: rough-heat-kernel/heat-kernel-semigroup
    status: reusable
    note: Semigroup identity p_t * p_s = p_{t+s} for the 1-d heat kernel, as functions via Mathlib's convolution,
      for s,t > 0.
  - source: null
    lean: RoughHeatKernel.eLpNorm_heatKernel
    module: RoughHeatKernel/Lq.lean
    kind: theorem
    claim: rough-heat-kernel/heat-kernel-lq-norm
    status: reusable
    note: 'Exact L^q norm of the heat kernel for every q in [1, infinity]: C_q t^{-(1-1/q)/2} with an
      explicit constant.'
  - source: null
    lean: RoughHeatKernel.continuous_heatFlow
    module: RoughHeatKernel/Tempered.lean
    kind: theorem
    claim: rough-heat-kernel/heat-flow-continuous
    status: reusable
    note: For a Gaussian-tempered positive measure (possibly of infinite mass) and t > 0, the heat flow
      x -> int p_t(x-y) nu(dy) is continuous.
  - source: null
    lean: RoughHeatKernel.integrable_exp_mul_heatFlow_rpow
    module: RoughHeatKernel/Tempered.lean
    kind: theorem
    claim: rough-heat-kernel/heat-flow-weighted-lp
    status: reusable
    note: 'Weighted bound for the heat flow of a Gaussian-tempered measure: e^{-a x^2} (heat flow)^p is
      integrable for a, t > 0, p >= 1.'
  - source: null
    lean: RoughHeatKernel.exists_sqrt_mul_heatFlow_le
    module: RoughHeatKernel/Tempered.lean
    kind: theorem
    claim: rough-heat-kernel/heat-flow-local-sup
    status: reusable
    note: 'Local small-time bound: sqrt(s) times the heat flow of a Gaussian-tempered measure is bounded
      uniformly on s in (0,T], |y| <= R.'
  - source: null
    lean: RoughHeatKernel.ofReal_heatFlow
    module: RoughHeatKernel/Tempered.lean
    kind: theorem
    claim: rough-heat-kernel/ennreal-heat-flow
    status: reusable
    note: For a Gaussian-tempered measure and t > 0, the extended-real heat flow lheatFlow equals ofReal
      of the real heat flow (and is finite).
  - source: null
    lean: RoughHeatKernel.RoughMeasure.abs_heatFlow_le
    module: RoughHeatKernel/RoughMeasure.lean
    kind: theorem
    claim: rough-heat-kernel/rough-measure-heat-flow-bound
    status: reusable
    note: For a signed measure with Gaussian-tempered total variation (Jordan pair), |heat flow of mu|
      <= heat flow of |mu|.
  - source: null
    lean: RoughHeatKernel.RoughMeasure.abs_heatFlow_le_of_isFiniteMeasure
    module: RoughHeatKernel/Finite.lean
    kind: theorem
    claim: rough-heat-kernel/finite-measure-heat-flow-bound
    status: reusable
    note: For a finite signed measure, |heat flow| <= (2 pi t)^{-1/2} |mu|(R) at every point.
  - source: null
    lean: RoughHeatKernel.heatKernel_eq_gaussianPDFReal
    module: RoughHeatKernel/Gaussian.lean
    kind: theorem
    claim: rough-heat-kernel/gaussian-bridge
    status: reusable
    note: 'The heat kernel is Mathlib''s centred Gaussian density: heatKernel t = gaussianPDFReal 0 t.toNNReal
      for every real t.'
  - source: null
    lean: RoughHeatKernel.integral_gaussianReal_eq_integral_heatKernel
    module: RoughHeatKernel/Gaussian.lean
    kind: theorem
    claim: rough-heat-kernel/gaussian-real-integral
    status: reusable
    note: Integration against the normal law gaussianReal x t equals integration against heatKernel t
      (x - y), for t != 0.
  - source: null
    lean: RoughHeatKernel.RoughMeasure.toSignedMeasure_ofSignedMeasure
    module: RoughHeatKernel/Finite.lean
    kind: theorem
    claim: rough-heat-kernel/signed-measure-bridge
    status: reusable
    note: A Mathlib SignedMeasure on R becomes a RoughMeasure via its Jordan decomposition; positive minus
      negative part recovers s, and the total variation is s.totalVariation.
  - source: null
    lean: RoughHeatKernel.lheatFlow_eq_ofReal_mul_lintegral
    module: RoughHeatKernel/Tempered.lean
    kind: theorem
    claim: rough-heat-kernel/lheat-flow-gaussian-weight
    status: reusable
    note: For every measure and every real t, the extended-real heat flow equals ofReal((2 pi t)^{-1/2})
      times the lower integral of exp(-(x-y)^2/(2t)).
  - source: null
    lean: RoughHeatKernel.RoughMeasure.totalVariation_ofTempered
    module: RoughHeatKernel/RoughMeasure.lean
    kind: theorem
    claim: rough-heat-kernel/rough-measure-of-tempered
    status: reusable
    note: A Jordan pair whose total variation pos + neg is Gaussian-tempered is a RoughMeasure (single-condition
      form of the class), with that total variation.
