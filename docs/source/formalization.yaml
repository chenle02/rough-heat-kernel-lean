    claim: rough-heat-kernel/heat-kernel-spatial-increment
    status: reusable
    note: 'Spatial L^1 increment of the 1-d heat kernel: int |p_t(x-y) - p_t(z-y)| dy <= min(2, |x-z|/sqrt
