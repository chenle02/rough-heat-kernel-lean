    status: reusable
    note: 'L^1 mean-value inequality: if F has derivative F'' in theta on [a,b], F'' is continuous in
      theta for each y and jointly measurable, then int |F(b,y)-F(a,y)| dy <= int_a^b int |F''(theta,y)|
      dy dtheta (lower integrals).'
