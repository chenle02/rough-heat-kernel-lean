schema: coverage/1
package: rough-heat-kernel
kind: library
summary: Deterministic one-dimensional Gaussian heat kernels, positive and signed Gaussian-tempered initial
  measures, kernel increments and rough-data convolution bounds. Candidate statements; release verification
  pending.
rows:
- title: Heat-kernel convolution semigroup
  claims:
  - rough-heat-kernel/heat-kernel-semigroup
  statement: Semigroup identity p_t * p_s = p_{t+s} for the 1-d heat kernel, as functions via Mathlib's
    convolution, for s,t > 0.
- title: Exact heat-kernel Lq norm
  claims:
  - rough-heat-kernel/heat-kernel-lq-norm
  statement: 'Exact L^q norm of the heat kernel for every q in [1, infinity]: C_q t^{-(1-1/q)/2} with
    an explicit constant.'
- title: Spatial continuity of positive rough-data heat flow
  claims:
  - rough-heat-kernel/heat-flow-continuous
  statement: For a Gaussian-tempered positive measure (possibly of infinite mass) and t > 0, the heat
    flow x -> int p_t(x-y) nu(dy) is continuous.
- title: Gaussian-weighted Lp integrability
  claims:
  - rough-heat-kernel/heat-flow-weighted-lp
  statement: 'Weighted bound for the heat flow of a Gaussian-tempered measure: e^{-a x^2} (heat flow)^p
    is integrable for a, t > 0, p >= 1.'
- title: Local small-time heat-flow bound
  claims:
  - rough-heat-kernel/heat-flow-local-sup
  statement: 'Local small-time bound: sqrt(s) times the heat flow of a Gaussian-tempered measure is bounded
    uniformly on s in (0,T], |y| <= R.'
- title: Real and extended-real heat-flow conversion
  claims:
  - rough-heat-kernel/ennreal-heat-flow
  statement: For a Gaussian-tempered measure and t > 0, the extended-real heat flow lheatFlow equals ofReal
    of the real heat flow (and is finite).
- title: Signed-flow domination by total variation
  claims:
  - rough-heat-kernel/rough-measure-heat-flow-bound
  statement: For a signed measure with Gaussian-tempered total variation (Jordan pair), |heat flow of
    mu| <= heat flow of |mu|.
- title: Finite-data heat-flow bound
  claims:
  - rough-heat-kernel/finite-measure-heat-flow-bound
  statement: For a finite signed measure, |heat flow| <= (2 pi t)^{-1/2} |mu|(R) at every point.
- title: Mathlib Gaussian-density bridge
  claims:
  - rough-heat-kernel/gaussian-bridge
  statement: 'The heat kernel is Mathlib''s centred Gaussian density: heatKernel t = gaussianPDFReal 0
    t.toNNReal for every real t.'
- title: Integration against a Gaussian law
  claims:
  - rough-heat-kernel/gaussian-real-integral
  statement: Integration against the normal law gaussianReal x t equals integration against heatKernel
    t (x - y), for t != 0.
- title: Mathlib finite SignedMeasure bridge
  claims:
  - rough-heat-kernel/signed-measure-bridge
  statement: A Mathlib SignedMeasure on R becomes a RoughMeasure via its Jordan decomposition; positive
    minus negative part recovers s, and the total variation is s.totalVariation.
- title: Extended-real Gaussian-weight formula
  claims:
  - rough-heat-kernel/lheat-flow-gaussian-weight
  statement: For every measure and every real t, the extended-real heat flow equals ofReal((2 pi t)^{-1/2})
    times the lower integral of exp(-(x-y)^2/(2t)).
- title: Rough measure from a tempered Jordan pair
  claims:
  - rough-heat-kernel/rough-measure-of-tempered
  statement: A Jordan pair whose total variation pos + neg is Gaussian-tempered is a RoughMeasure (single-condition
    form of the class), with that total variation.
- title: Spatial L1 kernel increment
  claims:
  - rough-heat-kernel/heat-kernel-spatial-increment
  statement: 'Spatial L^1 increment of the 1-d heat kernel: int |p_t(x-y) - p_t(z-y)| dy <= min(2, |x-z|/sqrt
    t) for t > 0.'
- title: Forward-time L1 kernel increment
  claims:
  - rough-heat-kernel/heat-kernel-time-increment
  statement: 'Time L^1 increment of the 1-d heat kernel: int |p_{t+e}(x-y) - p_t(x-y)| dy <= min(2, e/t)
    for t > 0, e >= 0.'
- title: Time derivative of the heat kernel
  claims:
  - rough-heat-kernel/heat-kernel-derivatives
  statement: 'Time derivative of the heat kernel: d/dt p_t(x) = (x^2 - t)/(2 t^2) p_t(x) for t > 0 (the
    spatial one, -(x/t) p_t(x), is hasDerivAt_heatKernel).'
- title: L1 mean-value inequality
  claims:
  - rough-heat-kernel/l1-mean-value-inequality
  statement: 'L^1 mean-value inequality: if F has derivative F'' in theta on [a,b], F'' is continuous
    in theta for each y and jointly measurable, then int |F(b,y)-F(a,y)| dy <= int_a^b int |F''(theta,y)|
    dy dtheta (lower integrals).'
- title: Second Gaussian kernel moment
  claims:
  - rough-heat-kernel/heat-kernel-moments
  statement: 'Gaussian moments of the heat kernel: int x^2 p_t(x) dx = t, and int |x| p_t(x) dx <= sqrt
    t (integral_abs_mul_heatKernel_le), for t > 0.'
- title: Chen–Dalang Gaussian convolution estimate
  claims:
  - rough-heat-kernel/chen-dalang-convolution
  statement: 'Chen-Dalang estimate (Gaussian case): for s-finite nu, t > 0, measurable h >= 0, int_0^t
    int J(s,y)^2 p_{(t-s)/2}(x-y) h(t-s) dy ds <= 2 sqrt t J(2t,x)^2 int_0^t h(t-s)/sqrt s ds, J = lheatFlow
    nu (lower integrals).'
- title: Gaussian product identity
  claims:
  - rough-heat-kernel/gaussian-product-identity
  statement: 'Gaussian product identity: p_t(y-z1) p_t(y-z2) = p_{2t}(z1-z2) p_{t/2}(y-(z1+z2)/2) for
    t > 0.'
- title: Heat-kernel comparison across times
  claims:
  - rough-heat-kernel/heat-kernel-comparison
  statement: 'Heat-kernel comparison across times: p_a(x) <= sqrt(b/a) p_b(x) for 0 < a <= b.'
- title: Local finiteness of Gaussian-tempered measures
  claims:
  - rough-heat-kernel/tempered-locally-finite
  statement: A Gaussian-tempered measure on R is locally finite (finite on bounded sets), hence sigma-finite.
- title: Squared-kernel rough-data convolution bound
  claims:
  - rough-heat-kernel/white-noise-convolution
  statement: 'White-noise Chen-Dalang bound: for s-finite nu and t > 0, int_0^t int J(s,y)^2 p_{t-s}(x-y)^2
    dy ds <= sqrt(pi) sqrt(t) J(2t,x)^2 with J = lheatFlow nu, as lower integrals.'
- title: Squared heat-kernel identity
  claims:
  - rough-heat-kernel/heat-kernel-square
  statement: 'Squared heat kernel: p_r(z)^2 = p_{r/2}(z) (4 pi r)^{-1/2} for r > 0; hence int p_r^2 =
    (4 pi r)^{-1/2} (integral_heatKernel_sq).'
- title: Arcsine integral
  claims:
  - rough-heat-kernel/arcsine-integral
  statement: 'The arcsine integral: int_0^t ds / sqrt(s (t - s)) = pi for t > 0, as a lower Lebesgue integral.'
- title: Positive heat-flow semigroup
  claims:
  - rough-heat-kernel/heat-flow-semigroup
  statement: 'Heat-flow semigroup: for s-finite nu and 0 < s < t, int p_{t-s}(x-y) J(s,y) dy = J(t,x)
    with J = lheatFlow nu, as a lower integral.'
- title: Time-integrated positive heat-flow semigroup
  claims:
  - rough-heat-kernel/heat-flow-time-integral
  statement: 'Time-integrated heat-flow semigroup: for s-finite nu, int_0^t int p_{t-s}(x-y) J(s,y) dy
    ds = t J(t,x) with J = lheatFlow nu, as lower integrals.'
- title: Gaussian doubling comparison
  claims:
  - rough-heat-kernel/heat-kernel-doubling
  statement: For t > 0 and 0 <= s <= t, p_(t+s)(x) <= sqrt(2) p_(2t)(x).
- title: Positive heat-flow doubling comparison
  claims:
  - rough-heat-kernel/heat-flow-doubling
  statement: For every positive measure nu, t > 0 and 0 <= s <= t, J(t+s,x) <= sqrt(2) J(2t,x), with J
    = lheatFlow nu.
- title: Doubled heat-flow semigroup identity
  claims:
  - rough-heat-kernel/doubled-heat-flow-semigroup
  statement: For every s-finite nu and 0 < s < t, the lower integral of p_(t-s)(x-y) J(2s,y) equals J(t+s,x).
- title: Doubled heat-flow linear bound
  claims:
  - rough-heat-kernel/doubled-heat-flow-linear-bound
  statement: For every s-finite nu and 0 < s < t, the lower integral of p_(t-s)(x-y) J(2s,y) is at most
    sqrt(2) J(2t,x).
- title: Doubled Gaussian product convolution bound
  claims:
  - rough-heat-kernel/doubled-gaussian-product-bound
  statement: For 0 < s < t, the lower integral of p_(2s)(y-z1) p_(2s)(y-z2) p_((t-s)/2)(x-y) is at most
    sqrt(2t/s) p_(2t)(x-z1) p_(2t)(x-z2).
- title: Doubled heat-flow quadratic bound
  claims:
  - rough-heat-kernel/doubled-heat-flow-quadratic-bound
  statement: For every s-finite nu and 0 < s < t, the lower integral of p_(t-s)(x-y)^2 J(2s,y)^2 is at
    most sqrt(t)/(sqrt(2*pi)*sqrt(s*(t-s))) J(2t,x)^2.
